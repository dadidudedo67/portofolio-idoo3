<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft - Select World</title>
  <!-- Menghubungkan ke file style-play.css -->
  <link rel="stylesheet" href="style-play.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

  <header class="top-bar">
    <div class="top-title">PLAY</div>
    <div class="top-right">Friends (0)</div>
  </header>

  <div class="tabs-bar">
    <div class="tab active">Worlds (8)</div>
    <div class="tab">Realms</div>
    <div class="tab">Servers</div>
  </div>

  <div class="action-bar">
    <button class="btn-create">+ Create New World</button>
  </div>

  <main class="world-grid">

    <a href="https://github.com/username/project1" target="_blank" class="world-card">
      <div class="thumbnail">
        <img src="https://via.placeholder.com/300x180/333/fff?text=Project+1" alt="World Preview">
      </div>
      <div class="world-info">
        <h3>Web E-Commerce</h3>
        <span class="mode-tag survival">Survival</span>
      </div>
    </a>

    <a href="https://github.com/username/project2" target="_blank" class="world-card">
      <div class="thumbnail">
        <img src="https://via.placeholder.com/300x180/444/fff?text=Project+2" alt="World Preview">
      </div>
      <div class="world-info">
        <h3>Bot Discord JS</h3>
        <span class="mode-tag creative">Creative</span>
      </div>
    </a>

    <a href="https://github.com/username/project3" target="_blank" class="world-card">
      <div class="thumbnail">
        <img src="https://via.placeholder.com/300x180/555/fff?text=Project+3" alt="World Preview">
      </div>
      <div class="world-info">
        <h3>Portfolio Mobile App</h3>
        <span class="mode-tag experimental">Experimental</span>
      </div>
    </a>

    <a href="https://github.com/username/project4" target="_blank" class="world-card">
      <div class="thumbnail">
        <img src="https://via.placeholder.com/300x180/222/fff?text=Project+4" alt="World Preview">
      </div>
      <div class="world-info">
        <h3>Python AI Script</h3>
        <span class="mode-tag survival">Survival</span>
      </div>
    </a>

  </main>

  <footer class="bottom-bar">
    <a href="index.html" class="btn-back">
      <span class="btn-icon">B</span> Back
    </a>
  </footer>

</body>
</html>
